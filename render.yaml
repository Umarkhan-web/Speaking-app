services:
  - type: web
    name: birdan-api
    env: python
    rootDir: speaking-analyzer
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: RENDER_EXTERNAL_URL
        value: https://speaking-app-nqdr.onrender.com
